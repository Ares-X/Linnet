# Linnet Windows presentation boundary. The complete preset_color_schemes map
# is projected from data/squirrel.yaml by scripts/project-windows-weasel-config.
# Input behavior remains owned by the shared Linnet schemas and runtime.
config_version: "0.22"

show_notifications: true
show_notifications_time: 1200
global_ascii: false

app_options:
  cmd.exe:
    ascii_mode: true
  conhost.exe:
    ascii_mode: true
  firefox.exe:
    inline_preedit: true

style:
  antialias_mode: default
  ascii_tip_follow_cursor: false
  color_scheme: linnet_paper_light
  color_scheme_dark: linnet_paper_dark
  font_face: Microsoft YaHei UI
  label_font_face: Microsoft YaHei UI
  comment_font_face: Microsoft YaHei UI
  font_point: 14
  label_font_point: 12
  comment_font_point: 12
  candidate_abbreviate_length: 0
  click_to_capture: false
  horizontal: true
  fullscreen: false
  inline_preedit: false
  preedit_type: composition
  display_tray_icon: false
  label_format: "%s."
  mark_text: ""
  hover_type: none
  paging_on_scroll: true
  vertical_auto_reverse: false
  vertical_text: false
  vertical_text_left_to_right: false
  vertical_text_with_wrap: false
  layout:
    align_type: center
    max_width: 0
    min_width: 180
    min_height: 0
    max_height: 0
    border_width: 1
    margin_x: 10
    margin_y: 8
    spacing: 8
    candidate_spacing: 6
    hilite_spacing: 4
    hilite_padding: 4
    round_corner: 7
    corner_radius: 7
    shadow_radius: 0
    shadow_offset_x: 0
    shadow_offset_y: 0
    linespacing: 0
    baseline: 0
