# By default, SwiftLint uses a set of sensible default rules you can adjust:
disabled_rules: # rule identifiers turned on by default to exclude from running
  - force_cast
  - force_try
  - todo
opt_in_rules: # some rules are turned off by default, so you need to opt-in

# Alternatively, specify all rules explicitly by uncommenting this option:
# only_rules: # delete `disabled_rules` & `opt_in_rules` if using this
#   - empty_parameters
#   - vertical_whitespace

analyzer_rules: # rules run by `swiftlint analyze`
  - explicit_self

included: # case-sensitive paths to include during linting. `--path` is ignored if present
  - sources
excluded: # case-sensitive paths to ignore during linting. Takes precedence over `included`

# If true, SwiftLint will not fail if no lintable files are found.
allow_zero_lintable_files: false

# If true, SwiftLint will treat all warnings as errors.
strict: false

# rules that have both warning and error levels, can set just the warning level
# implicitly
line_length: 200
function_body_length: 200
cyclomatic_complexity:
  warning: 15
  error: 25
function_parameter_count:
  warning: 8
  error: 10
# they can set both implicitly with an array
type_body_length:
  - 400 # warning
  - 500 # error
# Linnet's largest filesystem owner intentionally keeps mutation helpers in one
# lexical file so Swift `private` remains private. Function, type-body and
# complexity limits carry the structural signal; this tight physical cap
# prevents that reviewed owner from growing without a new warning.
file_length:
  warning: 1850
  error: 1900
# naming rules can set warnings/errors for min_length and max_length
# additionally they can set excluded names
type_name:
  min_length: 4 # only warning
  max_length: # warning and error
    warning: 40
    error: 50
  excluded: # excluded via string
  allowed_symbols: ["_"] # these are allowed in type names
identifier_name:
  min_length: # only min_length
    warning: 3
    error: 2
  excluded: [i, id, URL, of, by] # excluded via string array
nesting:
  type_level: 2
large_tuple:
  warning: 3
  error: 5
reporter: "github-actions-logging" # reporter type (xcode, json, csv, checkstyle, codeclimate, junit, html, emoji, sonarqube, markdown, github-actions-logging, summary)
