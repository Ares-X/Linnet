name: Linnet community release

on:
  push:
    tags:
      - 'linnet-candidate/v*-*'
      - 'linnet-publication/v*-*-a*'

permissions:
  contents: read

jobs:
  build-candidate:
    if: >-
      github.event_name == 'push' &&
      github.event.created == true &&
      github.event.deleted == false &&
      github.repository == 'Ares-X/Linnet' &&
      github.actor == 'Ares-X' &&
      startsWith(github.ref, 'refs/tags/linnet-candidate/') &&
      github.run_attempt == 1
    concurrency:
      group: linnet-release-candidate
      cancel-in-progress: true
    environment: community-signing
    permissions:
      actions: read
      contents: read
    runs-on: macos-latest
    steps:
      - name: Checkout exact protected-main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Validate the SSH candidate intent and exact main CI before secrets
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_REF: ${{ github.ref }}
          LINNET_CANDIDATE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = push
          test "${GITHUB_REPOSITORY}" = Ares-X/Linnet
          test "${GITHUB_ACTOR}" = Ares-X
          test "${GITHUB_RUN_ATTEMPT}" = 1
          [[ "${LINNET_CANDIDATE_REVISION}" =~ ^[0-9a-f]{40}$ ]]
          candidate_pattern='^refs/tags/linnet-candidate/v([0-9]+\.[0-9]+\.[0-9]+)-([0-9a-f]{40})$'
          [[ "${CANDIDATE_REF}" =~ ${candidate_pattern} ]]
          requested_version="${BASH_REMATCH[1]}"
          requested_revision="${BASH_REMATCH[2]}"
          test "${requested_revision}" = "${LINNET_CANDIDATE_REVISION}"
          test -z "$(git status --porcelain)"
          test "$(git rev-parse --verify HEAD^{commit})" = \
            "${LINNET_CANDIDATE_REVISION}"
          candidate_tag="${CANDIDATE_REF#refs/tags/}"
          tag_json="${RUNNER_TEMP}/linnet-candidate-tag.json"
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${candidate_tag}" \
            >"${tag_json}"
          ruby -rjson -e '
            tag = JSON.parse(File.binread(ARGV.fetch(0)))
            abort "candidate intent ref differs" unless
              tag.fetch("ref") == ARGV.fetch(1)
            object = tag.fetch("object")
            abort "candidate intent must be a lightweight commit tag" unless
              object.fetch("type") == "commit" && object.fetch("sha") == ARGV.fetch(2)
          ' "${tag_json}" "${CANDIDATE_REF}" "${LINNET_CANDIDATE_REVISION}"
          rm -f -- "${tag_json}"
          remote_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" \
            --jq '.object.sha')"
          test "${remote_main}" = "${LINNET_CANDIDATE_REVISION}"

          main_ci_runs="${RUNNER_TEMP}/linnet-main-ci-runs.json"
          gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/commit-ci.yml/runs" \
            -f head_sha="${LINNET_CANDIDATE_REVISION}" -f branch=main \
            -f event=push -F per_page=100 >"${main_ci_runs}"
          ruby -rjson -e '
            document = JSON.parse(File.binread(ARGV.fetch(0)))
            revision = ARGV.fetch(1)
            accepted = document.fetch("workflow_runs").select do |run|
              run.fetch("name") == "Linnet commit CI" &&
                run.fetch("path") == ".github/workflows/commit-ci.yml" &&
                run.fetch("head_sha") == revision &&
                run.fetch("head_branch") == "main" &&
                run.fetch("event") == "push" &&
                run.fetch("status") == "completed" &&
                run.fetch("conclusion") == "success" &&
                run.fetch("run_attempt") == 1 &&
                run.dig("repository", "full_name") == "Ares-X/Linnet" &&
                run.dig("head_repository", "full_name") == "Ares-X/Linnet"
            end
            abort "candidate requires exactly one successful exact main CI" unless
              accepted.size == 1
          ' "${main_ci_runs}" "${LINNET_CANDIDATE_REVISION}"
          rm -f -- "${main_ci_runs}"

          product_version="$(sed -n \
            's/^MARKETING_VERSION = \([^[:space:]]*\)$/\1/p' \
            config/LinnetProduct.xcconfig | LC_ALL=C sort -u)"
          test "${product_version}" = "${requested_version}"
          package/data_release_metadata validate config/linnet-data-releases.json
          package/data_release_metadata check-core \
            config/linnet-data-releases.json "${product_version}"
          ruby scripts/upstream-sync report

          existing_artifacts="${RUNNER_TEMP}/linnet-existing-candidates.json"
          artifact_name="linnet-${product_version}-${LINNET_CANDIDATE_REVISION}"
          gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts" \
            -f name="${artifact_name}" -F per_page=100 >"${existing_artifacts}"
          ruby -rjson -e '
            document = JSON.parse(File.binread(ARGV.fetch(0)))
            name = ARGV.fetch(1)
            duplicate = document.fetch("artifacts").any? do |artifact|
              artifact.fetch("name") == name && artifact.fetch("expired") == false
            end
            abort "an unexpired candidate already exists for this revision" if duplicate
          ' "${existing_artifacts}" "${artifact_name}"
          rm -f -- "${existing_artifacts}"
          {
            echo "version=${product_version}"
            echo "revision=${LINNET_CANDIDATE_REVISION}"
            echo "candidate_tag=${candidate_tag}"
          } >>"${GITHUB_OUTPUT}"

      - name: Restore locked build cache
        uses: ./.github/actions/restore-locked-build-cache
        with:
          save: false

      - name: Install declared build tools
        run: scripts/install_ci_build_tools.sh release

      - name: Prepare locked dependencies and generated data
        run: ./action-install.sh

      - name: Import the pinned community signing identity
        env:
          LINNET_COMMUNITY_CMS_P12_BASE64: ${{ secrets.LINNET_COMMUNITY_CMS_P12_BASE64 }}
          LINNET_COMMUNITY_CMS_P12_PASSWORD: ${{ secrets.LINNET_COMMUNITY_CMS_P12_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          test -n "${LINNET_COMMUNITY_CMS_P12_BASE64}"
          test -n "${LINNET_COMMUNITY_CMS_P12_PASSWORD}"
          signing_root="${RUNNER_TEMP}/linnet-community-signing"
          keychain="${signing_root}/community-cms.keychain-db"
          password_file="${signing_root}/keychain-password"
          p12_file="${signing_root}/community-cms.p12"
          original_keychains="${signing_root}/original-keychains"
          test ! -e "${signing_root}"
          install -d -m 0700 "${signing_root}"
          security list-keychains -d user |
            sed -E 's/^[[:space:]]*"([^"].*)"[[:space:]]*$/\1/' \
              >"${original_keychains}"
          test -s "${original_keychains}"
          printf '%s' "${LINNET_COMMUNITY_CMS_P12_BASE64}" |
            base64 -D >"${p12_file}"
          openssl rand -hex 32 >"${password_file}"
          chmod 0600 "${p12_file}" "${password_file}" "${original_keychains}"
          keychain_password="$(tr -d '\n' <"${password_file}")"
          security create-keychain -p "${keychain_password}" "${keychain}"
          security set-keychain-settings -lut 21600 "${keychain}"
          security unlock-keychain -p "${keychain_password}" "${keychain}"
          security import "${p12_file}" -k "${keychain}" \
            -P "${LINNET_COMMUNITY_CMS_P12_PASSWORD}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "${keychain_password}" "${keychain}"
          keychains=()
          while IFS= read -r existing; do keychains+=("${existing}"); done \
            <"${original_keychains}"
          security list-keychains -d user -s "${keychains[@]}" "${keychain}"
          chmod 0600 "${keychain}"
          {
            echo "LINNET_CODE_SIGN_KEYCHAIN=${keychain}"
            echo "LINNET_CODE_SIGN_PASSWORD_FILE=${password_file}"
          } >>"${GITHUB_ENV}"

      - name: Build and sign the candidate exactly once
        env:
          LINNET_CANDIDATE_REVISION: ${{ steps.request.outputs.revision }}
          ARCHIVE_OUTPUT_DIR: ${{ runner.temp }}/linnet-candidate/release
        run: |
          set -euo pipefail
          test ! -e "${RUNNER_TEMP}/linnet-candidate"
          mkdir -p "${ARCHIVE_OUTPUT_DIR}"
          make --no-print-directory archive

      - name: Verify and bind the exact candidate bytes
        id: identity
        env:
          LINNET_CANDIDATE_REVISION: ${{ steps.request.outputs.revision }}
          ARCHIVE_OUTPUT_DIR: ${{ runner.temp }}/linnet-candidate/release
          LINNET_RELEASE_TOOL: ${{ runner.temp }}/linnet-pack
        run: |
          set -euo pipefail
          xcrun swiftc -warnings-as-errors \
            sources/LinnetPackContract.swift \
            sources/LinnetDataChannel.swift \
            sources/LinnetDataRegistry.swift \
            tools/LinnetDataCatalogBuilder.swift \
            tools/LinnetPackTool.swift -o "${LINNET_RELEASE_TOOL}"
          version="${{ steps.request.outputs.version }}"
          package/verify_publication_artifacts "${ARCHIVE_OUTPUT_DIR}" \
            "${version}" "${LINNET_CANDIDATE_REVISION}"
          catalog_sequence="$(package/data_release_metadata get-catalog-sequence \
            config/linnet-data-releases.json)"
          {
            echo "version=${version}"
            echo "catalog_sequence=${catalog_sequence}"
            echo "artifact_name=linnet-${version}-${LINNET_CANDIDATE_REVISION}"
          } >>"${GITHUB_OUTPUT}"

      - name: Upload the immutable installation candidate
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: ${{ steps.identity.outputs.artifact_name }}
          path: ${{ runner.temp }}/linnet-candidate/release
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          overwrite: false
          include-hidden-files: false

      - name: Verify the uploaded artifact archive and extracted bytes
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          ARCHIVE_OUTPUT_DIR: ${{ runner.temp }}/linnet-candidate/release
        run: |
          set -euo pipefail
          [[ "${ARTIFACT_ID}" =~ ^[1-9][0-9]*$ ]]
          # upload-artifact exposes a bare SHA-256; the REST artifact resource
          # used by publication exposes the same value with a sha256: prefix.
          [[ "${ARTIFACT_DIGEST}" =~ ^[0-9a-f]{64}$ ]]
          artifact_zip="${RUNNER_TEMP}/linnet-candidate.zip"
          extracted="${RUNNER_TEMP}/linnet-candidate-roundtrip"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            >"${artifact_zip}"
          actual_digest="$(shasum -a 256 "${artifact_zip}" | awk '{print $1}')"
          test "${actual_digest}" = "${ARTIFACT_DIGEST}"
          mkdir "${extracted}"
          ditto -x -k "${artifact_zip}" "${extracted}"
          expected="${RUNNER_TEMP}/linnet-candidate-expected.tsv"
          actual="${RUNNER_TEMP}/linnet-candidate-actual.tsv"
          (cd "${ARCHIVE_OUTPUT_DIR}" && find . -type f -print0 | LC_ALL=C sort -z |
            xargs -0 shasum -a 256) >"${expected}"
          (cd "${extracted}" && find . -type f -print0 | LC_ALL=C sort -z |
            xargs -0 shasum -a 256) >"${actual}"
          cmp -s "${expected}" "${actual}"
          test "$(find "${extracted}" -mindepth 1 | wc -l | tr -d ' ')" = 8

      - name: Record the immutable installation candidate identity
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          ARCHIVE_OUTPUT_DIR: ${{ runner.temp }}/linnet-candidate/release
          LINNET_CANDIDATE_REVISION: ${{ steps.request.outputs.revision }}
        run: |
          {
            echo "### Linnet installation candidate"
            echo
            echo "- Source: \`${LINNET_CANDIDATE_REVISION}\`"
            echo "- Artifact ID: \`${ARTIFACT_ID}\`"
            echo "- Artifact digest: \`${ARTIFACT_DIGEST}\`"
            echo "- Download: ${ARTIFACT_URL}"
            echo
            echo '```text'
            find "${ARCHIVE_OUTPUT_DIR}" -mindepth 1 -maxdepth 1 -type f \
              -exec shasum -a 256 {} \; | LC_ALL=C sort
            echo '```'
          } >>"${GITHUB_STEP_SUMMARY}"

      - name: Remove the temporary signing secrets
        if: always()
        run: |
          set -uo pipefail
          signing_root="${RUNNER_TEMP}/linnet-community-signing"
          keychain="${signing_root}/community-cms.keychain-db"
          original_keychains="${signing_root}/original-keychains"
          cleanup_status=0
          if [[ -f "${original_keychains}" && ! -L "${original_keychains}" ]]; then
            keychains=()
            while IFS= read -r existing; do keychains+=("${existing}"); done \
              <"${original_keychains}"
            security list-keychains -d user -s "${keychains[@]}" || cleanup_status=$?
          fi
          if [[ -f "${keychain}" && ! -L "${keychain}" &&
            "${keychain%/*}" == "${signing_root}" ]]; then
            security delete-keychain "${keychain}" || cleanup_status=$?
          fi
          if [[ -e "${signing_root}" ]]; then
            if [[ -d "${signing_root}" && ! -L "${signing_root}" &&
              "${signing_root}" == "${RUNNER_TEMP}/linnet-community-signing" ]]; then
              rm -rf -- "${signing_root}" || cleanup_status=$?
            else
              cleanup_status=1
            fi
          fi
          exit "${cleanup_status}"

  publish-approved:
    if: >-
      github.event_name == 'push' &&
      github.event.created == true &&
      github.event.deleted == false &&
      github.repository == 'Ares-X/Linnet' &&
      github.actor == 'Ares-X' &&
      startsWith(github.ref, 'refs/tags/linnet-publication/')
    concurrency:
      group: linnet-release-publication
      queue: max
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
    runs-on: macos-latest
    steps:
      - name: Validate the SSH approval and exact artifact provenance
        id: approval
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVAL_REF: ${{ github.ref }}
          APPROVAL_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = push
          test "${GITHUB_REPOSITORY}" = Ares-X/Linnet
          test "${GITHUB_ACTOR}" = Ares-X
          approval_pattern='^refs/tags/linnet-publication/v[0-9]+\.[0-9]+\.[0-9]+-[0-9a-f]{40}-a[1-9][0-9]*$'
          [[ "${APPROVAL_REF}" =~ ${approval_pattern} ]]
          approval_tag="${APPROVAL_REF#refs/tags/}"
          artifact_id="${APPROVAL_REF##*-a}"
          [[ "${artifact_id}" =~ ^[1-9][0-9]*$ ]]

          tag_json="${RUNNER_TEMP}/linnet-approval-tag.json"
          artifact_json="${RUNNER_TEMP}/linnet-artifact.json"
          producer_json="${RUNNER_TEMP}/linnet-producer-run.json"
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${approval_tag}" \
            >"${tag_json}"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}" \
            >"${artifact_json}"
          producer_run_id="$(ruby -rjson -e '
            value = JSON.parse(File.binread(ARGV.fetch(0))).dig("workflow_run", "id")
            abort unless value.is_a?(Integer) && value.positive?
            puts value
          ' "${artifact_json}")"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${producer_run_id}" \
            >"${producer_json}"

          ruby -rjson -e '
            ref, approval_sha, output, tag_path, artifact_path, producer_path = ARGV
            match = ref.match(%r{\Arefs/tags/linnet-publication/v
              (?<version>[0-9]+\.[0-9]+\.[0-9]+)-
              (?<revision>[0-9a-f]{40})-a
              (?<artifact_id>[1-9][0-9]*)\z}x)
            abort unless match && approval_sha == match[:revision]

            tag = JSON.parse(File.binread(tag_path))
            artifact = JSON.parse(File.binread(artifact_path))
            run = JSON.parse(File.binread(producer_path))
            object = tag.fetch("object")
            artifact_run = artifact.fetch("workflow_run")
            revision = match[:revision]
            artifact_id = Integer(match[:artifact_id], 10)
            candidate_tag = "linnet-candidate/v#{match[:version]}-#{revision}"

            abort unless tag.fetch("ref") == ref &&
              object.fetch("type") == "commit" &&
              object.fetch("sha") == revision &&
              artifact.fetch("id") == artifact_id &&
              artifact.fetch("name") == "linnet-#{match[:version]}-#{revision}" &&
              artifact.fetch("expired") == false &&
              artifact.fetch("digest").match?(/\Asha256:[0-9a-f]{64}\z/) &&
              artifact_run.fetch("id") == run.fetch("id") &&
              artifact_run.fetch("head_sha") == revision &&
              artifact_run.fetch("head_branch") == candidate_tag &&
              artifact_run.fetch("repository_id") == run.dig("repository", "id") &&
              artifact_run.fetch("head_repository_id") == run.dig("head_repository", "id") &&
              run.fetch("name") == "Linnet community release" &&
              run.fetch("path") == ".github/workflows/release-ci.yml" &&
              run.fetch("head_sha") == revision &&
              run.fetch("head_branch") == candidate_tag &&
              run.fetch("event") == "push" &&
              run.fetch("status") == "completed" &&
              run.fetch("conclusion") == "success" &&
              run.fetch("run_attempt") == 1 &&
              run.dig("repository", "full_name") == "Ares-X/Linnet" &&
              run.dig("head_repository", "full_name") == "Ares-X/Linnet"

            File.open(output, "a") do |file|
              file.puts "version=#{match[:version]}"
              file.puts "revision=#{revision}"
              file.puts "artifact_id=#{artifact_id}"
              file.puts "artifact_digest=#{artifact.fetch("digest")}"
              file.puts "producer_run_id=#{run.fetch("id")}"
              file.puts "authorization_tag=#{ref.delete_prefix("refs/tags/")}"
            end
          ' "${APPROVAL_REF}" "${APPROVAL_SHA}" "${GITHUB_OUTPUT}" \
            "${tag_json}" "${artifact_json}" "${producer_json}"
          rm -f -- "${tag_json}" "${artifact_json}" "${producer_json}"

      - name: Checkout the approved candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ steps.approval.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Download and verify the approved artifact archive exactly once
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.approval.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ steps.approval.outputs.artifact_digest }}
          ARCHIVE_OUTPUT_DIR: ${{ runner.temp }}/linnet-candidate/release
        run: |
          set -euo pipefail
          [[ "${ARTIFACT_ID}" =~ ^[1-9][0-9]*$ ]]
          [[ "${ARTIFACT_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          artifact_zip="${RUNNER_TEMP}/linnet-approved-candidate.zip"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            >"${artifact_zip}"
          actual_digest="sha256:$(shasum -a 256 "${artifact_zip}" | awk '{print $1}')"
          test "${actual_digest}" = "${ARTIFACT_DIGEST}"
          mkdir -p "${ARCHIVE_OUTPUT_DIR}"
          ditto -x -k "${artifact_zip}" "${ARCHIVE_OUTPUT_DIR}"

      - name: Verify the approved candidate bytes
        env:
          ARCHIVE_OUTPUT_DIR: ${{ runner.temp }}/linnet-candidate/release
          LINNET_RELEASE_TOOL: ${{ runner.temp }}/linnet-pack
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          test "$(git rev-parse --verify HEAD^{commit})" = \
            "${{ steps.approval.outputs.revision }}"
          product_version="$(sed -n \
            's/^MARKETING_VERSION = \([^[:space:]]*\)$/\1/p' \
            config/LinnetProduct.xcconfig | LC_ALL=C sort -u)"
          test "${product_version}" = "${{ steps.approval.outputs.version }}"
          package/data_release_metadata validate config/linnet-data-releases.json
          package/data_release_metadata check-core \
            config/linnet-data-releases.json "${product_version}"
          xcrun swiftc -warnings-as-errors \
            sources/LinnetPackContract.swift \
            sources/LinnetDataChannel.swift \
            sources/LinnetDataRegistry.swift \
            tools/LinnetDataCatalogBuilder.swift \
            tools/LinnetPackTool.swift -o "${LINNET_RELEASE_TOOL}"
          package/verify_publication_artifacts "${ARCHIVE_OUTPUT_DIR}" \
            "${product_version}" "${{ steps.approval.outputs.revision }}"

      - name: Publish the unchanged approved candidate in channel order
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_OUTPUT_DIR: ${{ runner.temp }}/linnet-candidate/release
          LINNET_RELEASE_TOOL: ${{ runner.temp }}/linnet-pack
        run: |
          set -euo pipefail
          version="${{ steps.approval.outputs.version }}"
          revision="${{ steps.approval.outputs.revision }}"
          catalog_sequence="$(package/data_release_metadata get-catalog-sequence \
            config/linnet-data-releases.json)"
          package/publish_github_release core "${ARCHIVE_OUTPUT_DIR}" \
            "${version}" "${catalog_sequence}" "${revision}" \
            "${{ steps.approval.outputs.authorization_tag }}"
          package/publish_github_release data "${ARCHIVE_OUTPUT_DIR}" \
            "${version}" "${catalog_sequence}" "${revision}" \
            "${{ steps.approval.outputs.authorization_tag }}"
          package/publish_github_release catalog "${ARCHIVE_OUTPUT_DIR}" \
            "${version}" "${catalog_sequence}" "${revision}" \
            "${{ steps.approval.outputs.authorization_tag }}"
          package/publish_github_release public "${ARCHIVE_OUTPUT_DIR}" \
            "${version}" "${catalog_sequence}" "${revision}" \
            "${{ steps.approval.outputs.authorization_tag }}"
