name: Linnet community release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: linnet-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-source:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - name: Fingerprint the Xcode toolchain
        id: toolchain
        run: |
          fingerprint="$(xcodebuild -version | shasum -a 256 | awk '{print $1}')"
          echo "sha256=${fingerprint}" >> "${GITHUB_OUTPUT}"
      # Restored cache bytes are untrusted acceleration only. action-install.sh
      # revalidates locked commits, digests, fingerprints, and artifact shapes.
      - name: Restore locked build cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5.1.0
        with:
          path: |
            build/upstreams
            build/dependencies
            data/chinese/grammar
            build/linnet-english-cache
            build/linnet-english.fingerprint
            data/plum/build
            build/precompiled.fingerprint
          key: linnet-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.sha256 }}-${{ hashFiles('upstreams.lock.json', 'patches/**', 'action-install.sh', 'scripts/build-rime-runtime', 'scripts/generate-linnet-lua-embedding', 'tools/**', 'sources/**', 'data/linnet/**', 'data/chinese/**', 'config/linnet-data-releases.json') }}
          restore-keys: |
            linnet-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.sha256 }}-
      - name: Install declared build tools
        run: scripts/install_ci_build_tools.sh release
      - name: Validate key-free source and data inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -z "$(git status --porcelain)"
          test "$(git rev-parse --verify HEAD^{commit})" = "${GITHUB_SHA}"
          package/data_release_metadata validate config/linnet-data-releases.json
          product_version="$(sed -n 's/^MARKETING_VERSION = \([^[:space:]]*\)$/\1/p' config/LinnetProduct.xcconfig | LC_ALL=C sort -u)"
          package/data_release_metadata check-core config/linnet-data-releases.json "${product_version}"
          ruby scripts/upstream-sync report
      - name: Prepare locked dependencies and generated data
        run: ./action-install.sh

  publish-community:
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    runs-on: macos-latest
    steps:
      - name: Checkout the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Fingerprint the Xcode toolchain
        id: toolchain
        run: |
          fingerprint="$(xcodebuild -version | shasum -a 256 | awk '{print $1}')"
          echo "sha256=${fingerprint}" >> "${GITHUB_OUTPUT}"

      # Restored cache bytes are untrusted acceleration only. action-install.sh
      # revalidates locked commits, digests, fingerprints, and artifact shapes.
      - name: Restore locked build cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5.1.0
        with:
          path: |
            build/upstreams
            build/dependencies
            data/chinese/grammar
            build/linnet-english-cache
            build/linnet-english.fingerprint
            data/plum/build
            build/precompiled.fingerprint
          key: linnet-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.sha256 }}-${{ hashFiles('upstreams.lock.json', 'patches/**', 'action-install.sh', 'scripts/build-rime-runtime', 'scripts/generate-linnet-lua-embedding', 'tools/**', 'sources/**', 'data/linnet/**', 'data/chinese/**', 'config/linnet-data-releases.json') }}
          restore-keys: |
            linnet-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.sha256 }}-

      - name: Install declared build tools
        run: scripts/install_ci_build_tools.sh release

      - name: Validate tag and release data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -z "$(git status --porcelain)"
          test "$(git rev-parse --verify HEAD^{commit})" = "${GITHUB_SHA}"
          product_version="$(sed -n 's/^MARKETING_VERSION = \([^[:space:]]*\)$/\1/p' config/LinnetProduct.xcconfig | LC_ALL=C sort -u)"
          test "${GITHUB_REF_NAME}" = "v${product_version}"
          package/data_release_metadata validate config/linnet-data-releases.json
          package/data_release_metadata check-core config/linnet-data-releases.json "${product_version}"
          ruby scripts/upstream-sync report

      - name: Prepare locked dependencies and generated data
        run: ./action-install.sh

      - name: Build and verify unsigned community artifacts
        env:
          LINNET_CANDIDATE_REVISION: ${{ github.sha }}
          ARCHIVE_OUTPUT_DIR: ${{ runner.temp }}/linnet-release
        run: |
          mkdir -p "${ARCHIVE_OUTPUT_DIR}"
          make --no-print-directory archive

      - name: Verify the exact public artifact set
        env:
          LINNET_CANDIDATE_REVISION: ${{ github.sha }}
          ARCHIVE_OUTPUT_DIR: ${{ runner.temp }}/linnet-release
        run: |
          pack_tool="${RUNNER_TEMP}/linnet-pack"
          xcrun swiftc -warnings-as-errors \
            sources/LinnetPackContract.swift \
            sources/LinnetDataChannel.swift \
            sources/LinnetDataRegistry.swift \
            tools/LinnetDataCatalogBuilder.swift \
            tools/LinnetPackTool.swift -o "${pack_tool}"
          LINNET_RELEASE_TOOL="${pack_tool}" package/verify_publication_artifacts \
            "${ARCHIVE_OUTPUT_DIR}" "${GITHUB_REF_NAME#v}" \
            "${LINNET_CANDIDATE_REVISION}"

      - name: Publish same-repository update channels and the stable installer
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_OUTPUT_DIR: ${{ runner.temp }}/linnet-release
        run: |
          version="${GITHUB_REF_NAME#v}"
          catalog_sequence="$(package/data_release_metadata get-catalog-sequence \
            config/linnet-data-releases.json)"
          package/publish_github_release data "${ARCHIVE_OUTPUT_DIR}" \
            "${version}" "${catalog_sequence}" "${GITHUB_SHA}"
          package/publish_github_release core "${ARCHIVE_OUTPUT_DIR}" \
            "${version}" "${catalog_sequence}" "${GITHUB_SHA}"
          package/publish_github_release public "${ARCHIVE_OUTPUT_DIR}" \
            "${version}" "${catalog_sequence}" "${GITHUB_SHA}"
