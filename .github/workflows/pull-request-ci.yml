name: Linnet pull request CI
on: [pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout last commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          # Keep source submodules on their lock-owning build paths.
          submodules: false

      - name: Install build tools
        run: scripts/install_ci_build_tools.sh quality

      - name: Lint
        run: scripts/run_swiftlint.sh

      - name: Check language-data release identity changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "${BASE_SHA}"...HEAD |
            package/data_release_metadata check-source-change
          previous="$(mktemp)"
          trap 'rm -f "${previous}"' EXIT
          if git show "${BASE_SHA}:config/linnet-data-releases.json" >"${previous}" 2>/dev/null; then
            package/data_release_metadata check-monotonic \
              "${previous}" config/linnet-data-releases.json
          fi

      - name: Hydrate locked Windows frontend for root lock verification
        run: scripts/stage-windows-build-inputs hydrate

      - name: Build and verify Linnet
        run: ./action-build.sh release && tests/verify_development.sh

      - name: Stage shared Windows build inputs
        run: scripts/stage-windows-build-inputs

      - name: Upload root-owned Windows build inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: linnet-windows-inputs-${{ github.sha }}
          if-no-files-found: error
          retention-days: 1
          path: |
            data/plum
            data/opencc
            build/windows-inputs/linnet_embedded_lua.h
            build/windows-inputs/weasel.yaml
            build/windows-inputs/preview

      - name: Check Unused Code
        run: scripts/run_periphery.sh

  windows:
    needs: build
    uses: ./.github/workflows/windows-build.yml
