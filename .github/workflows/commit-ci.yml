name: Linnet commit CI
on:
  push:
    branches:
      - '**'
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout last commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          # action-install verifies and initializes the macOS locked source
          # submodules itself. Recursive checkout can chase unreachable
          # historical gitlinks from upstream tags.
          submodules: false

      - name: Install build tools
        run: scripts/install_ci_build_tools.sh quality

      - name: Lint
        run: scripts/run_swiftlint.sh

      - name: Check language-data release identity changes
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          changed="$(mktemp)"
          previous="$(mktemp)"
          trap 'rm -f "${changed}" "${previous}"' EXIT
          if git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            git diff --name-only "${BEFORE_SHA}" HEAD >"${changed}"
            if git show "${BEFORE_SHA}:config/linnet-data-releases.json" \
                >"${previous}" 2>/dev/null; then
              package/data_release_metadata check-monotonic \
                "${previous}" config/linnet-data-releases.json
            fi
          else
            git diff-tree --root --no-commit-id --name-only -r HEAD >"${changed}"
          fi
          package/data_release_metadata check-source-change <"${changed}"

      - name: Hydrate locked Windows frontend for root lock verification
        run: scripts/stage-windows-build-inputs hydrate

      - name: Build and verify Linnet
        run: ./action-build.sh release && tests/verify_development.sh

      - name: Stage shared Windows build inputs
        run: scripts/stage-windows-build-inputs

      - name: Upload root-owned Windows build inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: linnet-windows-inputs-${{ github.sha }}
          if-no-files-found: error
          retention-days: 1
          path: |
            data/plum
            data/opencc
            build/windows-inputs/linnet_embedded_lua.h
            build/windows-inputs/weasel.yaml
            build/windows-inputs/preview

      - name: Check Unused Code
        run: scripts/run_periphery.sh

  windows:
    needs: build
    uses: ./.github/workflows/windows-build.yml
