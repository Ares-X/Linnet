name: Linnet clean build CI
on: workflow_dispatch
permissions:
  contents: read

concurrency:
  group: linnet-manual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout last commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Restore locked build cache
        uses: ./.github/actions/restore-locked-build-cache
        with:
          save: true

      - name: Install declared build tools
        run: scripts/install_ci_build_tools.sh quality

      - name: Check source and publication contracts
        run: |
          scripts/run_swiftlint.sh
          tests/verify_publication_owner.sh

      - name: Check language-data release identity changes
        run: |
          set -euo pipefail
          changed="$(mktemp)"
          previous="$(mktemp)"
          trap 'rm -f "${changed}" "${previous}"' EXIT
          if git cat-file -e 'HEAD^' 2>/dev/null; then
            parent="$(git rev-parse 'HEAD^')"
            git diff --name-only "${parent}" HEAD >"${changed}"
            if git show "${parent}:config/linnet-data-releases.json" \
                >"${previous}" 2>/dev/null; then
              package/data_release_metadata check-monotonic \
                "${previous}" config/linnet-data-releases.json
            fi
          else
            git diff-tree --root --no-commit-id --name-only -r HEAD >"${changed}"
          fi
          package/data_release_metadata check-source-change <"${changed}"

      - name: Hydrate locked inputs
        run: ./action-install.sh

      - name: Build the unsigned product
        run: make --no-print-directory release

      - name: Check unused production code
        run: scripts/run_periphery.sh
