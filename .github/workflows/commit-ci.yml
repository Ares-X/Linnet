name: Linnet commit CI
on:
  push:
    branches:
      - main
permissions:
  contents: read

concurrency:
  group: linnet-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: macos-latest
    steps:
      - name: Checkout last commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          # action-install verifies and initializes the five locked source
          # submodules itself. Recursive checkout can chase unreachable
          # historical gitlinks from upstream tags.
          submodules: false

      - name: Install build tools
        run: scripts/install_ci_build_tools.sh quality

      - name: Lint
        run: scripts/run_swiftlint.sh

      - name: Check language-data release identity changes
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          changed="$(mktemp)"
          previous="$(mktemp)"
          trap 'rm -f "${changed}" "${previous}"' EXIT
          if git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            git diff --name-only "${BEFORE_SHA}" HEAD >"${changed}"
            if git show "${BEFORE_SHA}:config/linnet-data-releases.json" \
                >"${previous}" 2>/dev/null; then
              package/data_release_metadata check-monotonic \
                "${previous}" config/linnet-data-releases.json
            fi
          else
            git diff-tree --root --no-commit-id --name-only -r HEAD >"${changed}"
          fi
          package/data_release_metadata check-source-change <"${changed}"

      - name: Check release and publication owners
        run: tests/verify_release_automation.sh && tests/verify_publication_owner.sh

  product:
    needs: quality
    name: Product ${{ matrix.profile }}
    strategy:
      fail-fast: false
      matrix:
        profile: [app, settings-ui, swift, rime]
    runs-on: macos-latest
    steps:
      - name: Checkout last commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Restore locked build cache
        uses: ./.github/actions/restore-locked-build-cache
        with:
          save: ${{ matrix.profile == 'rime' }}

      - name: Install build tools
        run: scripts/install_ci_build_tools.sh release

      - name: Prepare and verify ${{ matrix.profile }} profile
        env:
          LINNET_CI_PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          case "${LINNET_CI_PROFILE}" in
            app)
              ./action-build.sh release
              tests/verify_development.sh app
              ;;
            settings-ui)
              ./action-build.sh release
              tests/verify_visible_settings_fixture.sh --ui-test
              ;;
            swift|rime)
              ./action-install.sh
              tests/verify_development.sh "${LINNET_CI_PROFILE}"
              ;;
            *) exit 2 ;;
          esac

      - name: Check Unused Code
        if: matrix.profile == 'app'
        run: scripts/run_periphery.sh
