name: Linnet Windows build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 75
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Download root-owned runtime data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: linnet-windows-inputs-${{ github.sha }}
          path: ${{ runner.temp }}\linnet-windows-inputs

      - name: Hydrate locked Windows and runtime sources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Locked digests name canonical Git blob bytes. The ephemeral runner
          # must not rewrite nested source and license files during checkout.
          git config --global core.autocrlf false
          git submodule update --init --depth 1 -- librime upstreams/weasel
          if ($LASTEXITCODE -ne 0) { throw 'Root submodule hydration failed' }
          git -C librime submodule update --init --recursive --depth 1
          if ($LASTEXITCODE -ne 0) { throw 'librime dependency hydration failed' }

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57  # v3

      - name: Prepare locked Boost and WinSparkle
        id: boost
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $lock = Get-Content -Raw upstreams.lock.json | ConvertFrom-Json
          $archive = Join-Path $env:RUNNER_TEMP 'boost.tar.gz'
          Invoke-WebRequest -Uri $lock.build_inputs.boost_headers.url -OutFile $archive
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actual -ne $lock.build_inputs.boost_headers.sha256) {
            throw 'Boost archive digest differs from upstreams.lock.json'
          }
          tar -xzf $archive -C $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw 'Boost extraction failed' }
          $root = Join-Path $env:RUNNER_TEMP $lock.build_inputs.boost_headers.archive_root
          "root=$root" >> $env:GITHUB_OUTPUT
          $updater = $lock.build_inputs.winsparkle
          $updaterArchive = Join-Path $env:RUNNER_TEMP 'winsparkle.zip'
          Invoke-WebRequest -Uri $updater.url -OutFile $updaterArchive
          if ((Get-FileHash -Algorithm SHA256 $updaterArchive).Hash.ToLowerInvariant() -ne $updater.sha256) {
            throw 'WinSparkle archive digest differs from upstreams.lock.json'
          }
          Expand-Archive -LiteralPath $updaterArchive -DestinationPath $env:RUNNER_TEMP
          "winsparkle=$(Join-Path $env:RUNNER_TEMP $updater.archive_root)" >> $env:GITHUB_OUTPUT
          $nsis = Join-Path ${env:ProgramFiles(x86)} 'NSIS\Bin\makensis.exe'
          if (-not (Test-Path -LiteralPath $nsis -PathType Leaf)) {
            throw 'The Windows runner does not provide the NSIS compiler required by Weasel'
          }

      - name: Install locked Swift build toolchain
        id: swift
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $swift = (Get-Content -Raw upstreams.lock.json | ConvertFrom-Json).build_inputs.swift_windows
          $installer = Join-Path $env:RUNNER_TEMP 'swift-toolchain.exe'
          Invoke-WebRequest -Uri $swift.url -OutFile $installer
          if ((Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant() -ne $swift.sha256) {
            throw 'Swift installer digest differs from upstreams.lock.json'
          }
          # SwiftDriverExecution depends on llbuildSwift from upstream's default
          # CLI component. No debugger, Python, IDE, Android or
          # second-architecture Swift runtime; both products use the x64 server.
          $setup = Start-Process -FilePath $installer -Wait -PassThru -ArgumentList @(
            '/install', '/quiet', '/norestart',
            'OptionsInstallDBG=0', 'OptionsInstallPy=0', 'OptionsInstallIDE=0',
            'OptionsInstallUtilities=0', 'OptionsInstallAndroidPlatform=0',
            'OptionsInstallWindowsSDKARM64=0', 'OptionsInstallWindowsRedistARM64=0',
            'OptionsInstallWindowsSDKX86=0', 'OptionsInstallWindowsRedistX86=0')
          if ($setup.ExitCode -notin @(0, 3010)) { throw "Swift setup failed: $($setup.ExitCode)" }
          $root = Join-Path $env:LOCALAPPDATA 'Programs\Swift'
          "root=$root" >> $env:GITHUB_OUTPUT

      - name: Project Linnet onto locked Weasel
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $windowsInputs = Join-Path $env:RUNNER_TEMP 'linnet-windows-inputs'
          platforms/windows/prepare.ps1 `
            -WinSparkleRoot '${{ steps.boost.outputs.winsparkle }}' `
            -DataRoot (Join-Path $windowsInputs 'data') `
            -EmbeddedLuaHeader (Join-Path $windowsInputs 'build/windows-inputs/linnet_embedded_lua.h') `
            -WeaselConfig (Join-Path $windowsInputs 'build/windows-inputs/weasel.yaml') `
            -ThemePreviewRoot (Join-Path $windowsInputs 'build/windows-inputs/preview') `
            -InputPolicyRoot (Join-Path $windowsInputs 'build/windows-inputs/policies') `
            -FactoryRoot (Join-Path $windowsInputs 'build/windows-inputs/factory')

      - name: Build x64 and ARM64 Windows installers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          platforms/windows/build.ps1 -BoostRoot '${{ steps.boost.outputs.root }}' `
            -SwiftRoot '${{ steps.swift.outputs.root }}'

      - name: Verify candidate runtime and install lifecycle
        # The Windows International module used to inspect enabled TIPs is a
        # Windows PowerShell module and fails to marshal its result in pwsh 7.
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          platforms/windows/preflight.ps1

      # This unsigned, expiring Actions artifact is engineering evidence only.
      # Product UAT must use the later signed, SHA-bound candidate, and no
      # workflow may attach Windows bytes to a GitHub Release before it passes.
      - name: Upload x64 Windows engineering candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: Linnet-Windows-x64-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: build/windows/weasel/output/archives/Linnet-Windows-*-x64-installer.exe

      - name: Upload ARM64 Windows engineering candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: Linnet-Windows-arm64-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: build/windows/weasel/output/archives/Linnet-Windows-*-arm64-installer.exe

      - name: Retain matching Windows debug symbols
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: Linnet-Windows-symbols-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            build/windows/weasel/output/**/*.pdb
            build/windows/weasel/librime/dist_x64/lib/rime.pdb
            build/windows/weasel/librime/dist_Win32/lib/rime.pdb
