name: Chinese Upstream Sync

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check stable upstreams
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Inspect public stable tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          report="${RUNNER_TEMP}/linnet-chinese-upstream-drift.txt"
          ruby scripts/upstream-sync report | tee "${report}"
          if ! grep -Eq '\| review( |\|)' "${report}"; then
            exit 0
          fi
          title='Chinese upstream update available'
          existing="$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open \
            --search "${title} in:title" --json number --jq '.[0].number // empty')"
          if [[ -n "${existing}" ]]; then
            echo "Open review issue already exists: #${existing}"
          else
            gh issue create --repo "${GITHUB_REPOSITORY}" \
              --title "${title}" --body-file "${report}"
          fi
