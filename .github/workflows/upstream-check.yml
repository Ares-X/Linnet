name: Linnet upstream report
on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 1'

permissions:
  contents: read

jobs:
  report:
    runs-on: macos-latest
    steps:
      - name: Checkout locked source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Verify lock and report candidates
        run: |
          ruby scripts/upstream-sync report | tee upstream-report.md
          cat upstream-report.md >> "$GITHUB_STEP_SUMMARY"
