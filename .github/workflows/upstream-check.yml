name: Linnet upstream report
on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 1'

permissions:
  contents: read

jobs:
  report:
    runs-on: macos-latest
    steps:
      - name: Checkout locked source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Verify lock and report candidates
        run: |
          ruby scripts/upstream-sync report | tee upstream-report.md
          cat upstream-report.md >> "$GITHUB_STEP_SUMMARY"
